name: Deploy OnlineJudge API

on:
  push:
    branches: [ "main" ]

jobs:
  # Step 1: GitHub Cloud Runner builds & pushes the Docker image
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: duckien185/onlinejudge_api:latest

  # Step 2: YOUR VM executes this job locally!
  deploy:
    needs: build-and-push
    strategy:
      matrix:
        target-vm: [VMware, AWS] 
    runs-on: [self-hosted, "${{ matrix.target-vm }}"]
    steps:
      - name: Checkout ONLY docker-compose.yml
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.yml
          sparse-checkout-cone-mode: false

      - name: Deploy with Docker Compose
        run: |
          cat << 'EOF' > .env
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          EOF

          docker compose up -d --remove-orphans

      - name: Cleanup dangling images
        run: |
          docker image prune -f
